<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GMI 단기선교 TV 슬라이드쇼</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    background: #0f1f3d; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; color: white;
    transform: scale(0.75); transform-origin: top left;
    width: 2560px; height: 1440px;
  }

  .slide { width: 2560px; height: 1440px; display: none; position: absolute; top: 0; left: 0; }
  .slide.active { display: flex; }

  /* ── 상세 슬라이드 ── */
  .detail-slide { flex-direction: row; }
  .detail-photo {
    width: 960px; height: 1440px; flex-shrink: 0;
    background-size: cover; background-position: center; position: relative;
  }
  .detail-photo::after {
    content: ''; position: absolute; top: 0; right: 0;
    width: 190px; height: 100%;
    background: linear-gradient(to right, transparent, #0f1f3d);
  }
  .detail-content {
    flex: 1; padding: 72px 110px 64px 68px;
    display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
  }
  .detail-region { font-size: 58px; color: #c8a96e; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
  .detail-country { font-size: 150px; font-weight: 700; line-height: 1.05; margin-bottom: 28px; }
  .detail-meta { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
  .meta-row { display: flex; gap: 20px; align-items: baseline; }
  .meta-label { font-size: 42px; color: rgba(255,255,255,0.7); width: 196px; flex-shrink: 0; }
  .meta-value { font-size: 50px; font-weight: 500; }
  .detail-divider { width: 100px; height: 5px; background: #c8a96e; margin-bottom: 26px; border-radius: 2px; }
  .detail-desc { font-size: 38px; line-height: 1.65; color: #ffffff; margin-bottom: 0; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  .outreach-title { font-size: 42px; color: #c8a96e; letter-spacing: 2px; margin-top: 56px; margin-bottom: 18px; }
  .outreach-list { list-style: none; display: flex; flex-direction: column; gap: 18px; }
  .outreach-list li { font-size: 44px; color: #ffffff; padding-left: 44px; position: relative; line-height: 1.35; }
  .outreach-list li::before { content: '•'; position: absolute; left: 0; color: #c8a96e; }
  .detail-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1px solid rgba(200,169,110,0.4); }
  .detail-org { font-size: 40px; color: rgba(255,255,255,0.7); }
  .detail-contact { font-size: 40px; color: #ffffff; }

  /* ── QR 슬라이드 ── */
  .qr-slide {
    background: linear-gradient(160deg, #0f1f3d 0%, #1a3a6b 100%);
    flex-direction: column; align-items: center; justify-content: center;
  }
  .qr-top-line {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(to right, transparent, #c8a96e 20%, #c8a96e 80%, transparent);
  }
  .qr-country-label { font-size: 96px; color: #c8a96e; margin-bottom: 32px; }
  .qr-title { font-size: 197px; font-weight: 700; margin-bottom: 115px; }
  .qr-codes { display: flex; gap: 285px; align-items: flex-start; }
  .qr-item { display: flex; flex-direction: column; align-items: center; gap: 40px; }
  .qr-box { width: 533px; height: 533px; background: white; border-radius: 45px; padding: 29px; display: flex; align-items: center; justify-content: center; }
  .qr-box img { width: 100%; height: 100%; }
  .qr-label { font-size: 77px; font-weight: 600; }
  .qr-sublabel { font-size: 53px; color: rgba(255,255,255,0.7); }
  .qr-divider { width: 3px; height: 533px; margin-top: 29px; background: linear-gradient(to bottom, transparent, rgba(200,169,110,0.5), transparent); }

  /* 진행 바 */
  .progress-bar { position: fixed; bottom: 0; left: 0; height: 5px; background: #c8a96e; transition: width linear; }

  /* 슬라이드 번호 */
  .slide-indicator { position: fixed; bottom: 14px; right: 30px; font-size: 20px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>

<div class="progress-bar" id="progress"></div>
<div class="slide-indicator" id="indicator"></div>

const DETAIL_DURATION = 15000;
const QR_DURATION = 12000;

function buildSlides() {
  const container = document.body;
  const slides = [];

  missions.forEach((m, i) => {
    // 상세 슬라이드
    const detail = document.createElement('div');
    detail.className = 'slide detail-slide';
    detail.id = 'slide-' + (i * 2);
    detail.innerHTML = `
      <div class="detail-photo" style="background-image: url('${m.photo}')"></div>
      <div class="detail-content">
        <div>
          <div class="detail-region">${m.region}</div>
          <div class="detail-country">${m.emoji} ${m.country}</div>
          <div class="detail-meta">
            <div class="meta-row"><span class="meta-label">파견 기간</span><span class="meta-value">${m.period}</span></div>
            <div class="meta-row"><span class="meta-label">선교사</span><span class="meta-value">${m.contact}</span></div>
            <div class="meta-row"><span class="meta-label">예상 비용</span><span class="meta-value">${m.cost}</span></div>
          </div>
          <div class="detail-divider"></div>
          <div class="detail-desc">${m.desc}</div>
          <div class="outreach-title">WHAT TO DO IN OUTREACH</div>
          <ul class="outreach-list">${m.outreach.map(o => `<li>${o}</li>`).join('')}</ul>
        </div>
        <div class="detail-footer">
          <span class="detail-org">${m.org}</span>
          <span class="detail-contact">문의: ${m.contact}</span>
        </div>
      </div>
    `;
    container.insertBefore(detail, document.getElementById('progress'));
    slides.push({ el: detail, duration: DETAIL_DURATION });

    // QR 슬라이드
    const qr = document.createElement('div');
    qr.className = 'slide qr-slide';
    qr.id = 'slide-' + (i * 2 + 1);
    qr.innerHTML = `
      <div class="qr-top-line"></div>
      <div class="qr-country-label">${m.emoji} ${m.country}</div>
      <div class="qr-title">지금 바로 신청하세요</div>
      <div class="qr-codes">
        <div class="qr-item">
          <div class="qr-box"><img src="${QR_API}${encodeURIComponent(m.applyUrl)}" alt="신청하기 QR"></div>
          <div class="qr-label">✍️ 신청하기</div>
          <div class="qr-sublabel">신청서 바로가기</div>
        </div>
        <div class="qr-divider"></div>
        <div class="qr-item">
          <div class="qr-box"><img src="${QR_API}${encodeURIComponent(WEBSITE)}" alt="웹사이트 QR"></div>
          <div class="qr-label">🌐 웹사이트</div>
          <div class="qr-sublabel">전체 선교지 보기</div>
        </div>
      </div>
    `;
    container.insertBefore(qr, document.getElementById('progress'));
    slides.push({ el: qr, duration: QR_DURATION });
  });

  return slides;
}

const slides = buildSlides();
const total = slides.length;
let current = 0;
let timer = null;

function showSlide(index) {
  slides.forEach(s => s.el.classList.remove('active'));
  slides[index].el.classList.add('active');
  document.getElementById('indicator').textContent = (index + 1) + ' / ' + total;
  startProgress(slides[index].duration);
}

function startProgress(duration) {
  const bar = document.getElementById('progress');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${duration}ms linear`;
    bar.style.width = '100%';
  }));
  clearTimeout(timer);
  timer = setTimeout(() => { current = (current + 1) % total; showSlide(current); }, duration);
}

// 키보드로 수동 조작 가능 (← →)
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') { clearTimeout(timer); current = (current + 1) % total; showSlide(current); }
  if (e.key === 'ArrowLeft')  { clearTimeout(timer); current = (current - 1 + total) % total; showSlide(current); }
});

showSlide(0);
</script>
</body>
</html>
